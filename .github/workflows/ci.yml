name: CI

on:
  push:
    branches: ["**"]
    # Tags too: a release build should never be the first CI this commit sees.
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (debug + release) + app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The app targets macOS 26, so the build needs Xcode 26. Swapped in only when the image has
      # it, so the workflow keeps working on an image where 26 is already the default.
      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version | grep -q "Xcode 26" || { echo "Xcode 26 not found on this runner"; ls /Applications | grep Xcode; exit 1; }
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Safe against the runner's real HOME: the tests only touch client configs under a
      # temporary directory.
      - name: swift test (debug)
        run: swift test

      # Worth the second full run: release builds optimize differently, and 0.1.0 shipped a crash
      # that existed only there (cancelling `Task.sleep(for:)` freed task allocations out of order
      # and aborted the daemon on every connection test) while debug stayed green throughout.
      - name: swift test (release)
        run: swift test -c release

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Apps/MCPManager
        run: xcodegen generate

      # No signing identity on the runner, and none is needed to know the app compiles.
      - name: Build app (Debug)
        working-directory: Apps/MCPManager
        run: |
          xcodebuild \
            -project MCPManager.xcodeproj \
            -scheme MCPManager \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  site:
    name: site pages + Accept negotiation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # The document pages are generated from their .md sources, so this fails when someone edits
      # one of the two and not the other.
      - run: npm run check
        working-directory: site
      - run: npm test
        working-directory: site
