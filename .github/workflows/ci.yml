name: CI

on:
  push:
    branches: ["**"]
    # Tags too: a release build should never be the first CI this commit sees.
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (debug + release) + app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The app targets macOS 26, so the build needs Xcode 26. Swapped in only when the image has
      # it, so the workflow keeps working on an image where 26 is already the default.
      - name: Select Xcode
        run: |
          # Pick the newest Xcode 26.x on the image; fail loudly if none (the app needs the 26 SDK).
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version | grep -q "Xcode 26" || { echo "Xcode 26 not found on this runner"; ls /Applications | grep Xcode; exit 1; }
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Runs against the runner's real HOME, which is fine: the tests never touch client configs
      # outside a temporary directory.
      - name: swift test (debug)
        run: swift test

      # Release builds optimize differently, and 0.1.0 shipped a crash that only existed there:
      # cancelling `Task.sleep(for:)` freed task allocations out of order and aborted the daemon
      # on every connection test. Debug was green throughout. This is the step that would have
      # caught it.
      - name: swift test (release)
        run: swift test -c release

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Apps/MCPManager
        run: xcodegen generate

      # No signing identity on the runner, and none is needed to know the app compiles.
      - name: Build app (Debug)
        working-directory: Apps/MCPManager
        run: |
          xcodebuild \
            -project MCPManager.xcodeproj \
            -scheme MCPManager \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
