name: MCPManager
options:
  bundleIdPrefix: co.charmtechnologies
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
packages:
  MCPM:
    path: ../..
targets:
  MCPManager:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources/Assets.xcassets
      # Not a resource: launchd looks for the agent's plist in Contents/Library/LaunchAgents, and
      # `SMAppService.agent(plistName:)` only finds it there.
      - path: Resources/co.charmtechnologies.mcpmd.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: MCPM
        product: MCPMCore
      - package: MCPM
        product: MCPMControl
    # The daemon ships inside the app so the LaunchAgent's BundleProgram always resolves to the
    # binary that came with the bundle the user actually has. SwiftPM builds it — the app target
    # can't, since an Xcode application target has one executable.
    preBuildScripts:
      - name: Build and embed mcpmd
        shell: /bin/bash
        # Outputs are declared for the build graph, but dependency analysis is off so the phase
        # runs every build: its real inputs are every file under the package's Sources/, which is
        # not a list worth maintaining here, and `swift build` is incremental so a no-op pass
        # costs a fraction of a second.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/mcpmd
        script: |
          set -euo pipefail
          # `swift` is not on the PATH Xcode hands a script phase.
          SWIFT="$(xcrun --find swift)"
          PACKAGE="$SRCROOT/../.."
          if [ "$CONFIGURATION" = "Release" ]; then SWIFT_CONFIG=release; else SWIFT_CONFIG=debug; fi
          # SwiftPM reads Xcode's build environment and mis-resolves its own toolchain from it.
          env -u SDKROOT -u TOOLCHAINS -u SWIFT_EXEC -u CC -u LD -u MACOSX_DEPLOYMENT_TARGET \
            "$SWIFT" build --package-path "$PACKAGE" --product mcpmd -c "$SWIFT_CONFIG"
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          mkdir -p "$DEST"
          cp -f "$PACKAGE/.build/$SWIFT_CONFIG/mcpmd" "$DEST/mcpmd"
          chmod +x "$DEST/mcpmd"
          # The daemon's own resources — the curated catalog — are a SwiftPM resource bundle, and
          # `swift build` leaves it beside the binary rather than in it. Without this the catalog
          # tab has nothing to show offline. Resources/ is where a bundle belongs, and where
          # BundledCatalog looks relative to the executable.
          BUNDLE="mcp-manager_MCPMDaemon.bundle"
          RESOURCES="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$RESOURCES"
          rm -rf "$RESOURCES/$BUNDLE"
          cp -R "$PACKAGE/.build/$SWIFT_CONFIG/$BUNDLE" "$RESOURCES/$BUNDLE"
    # Xcode signs the app bundle after every build phase has run, and it only signs the bundle's
    # own executable — a nested Mach-O it did not produce stays unsigned and fails notarization.
    postBuildScripts:
      - name: Sign embedded mcpmd
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] || exit 0
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-}"
          if [ -z "$IDENTITY" ]; then
            echo "error: no code signing identity for the embedded mcpmd" >&2
            exit 1
          fi
          # A secure timestamp is what notarization checks and what a local build has no use for.
          if [ "$CONFIGURATION" = "Release" ]; then TIMESTAMP=--timestamp; else TIMESTAMP=--timestamp=none; fi
          codesign --force --options runtime "$TIMESTAMP" --sign "$IDENTITY" \
            "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/mcpmd"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MCP Manager
        # Resolved from the build settings below so the version lives in exactly one place, and so
        # a MARKETING_VERSION= override on the xcodebuild command line reaches the bundle.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.charmtechnologies.mcpmanager
        # Keep in step with MCPMVersion.current in Sources/MCPMCore/Version.swift. The release
        # workflow can override it per-build with MARKETING_VERSION=... on the xcodebuild command
        # line, which wins over this project-level setting.
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

# Shared scheme so CI and the README can build with `-scheme MCPManager` (Xcode 26 requires a
# scheme when -derivedDataPath is given).
schemes:
  MCPManager:
    build:
      targets:
        MCPManager: all
    run:
      config: Debug
    archive:
      config: Release
