<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:2400px; height:1260px; overflow:hidden;
    font-family:"Geist",-apple-system,system-ui,sans-serif;
    background:
      radial-gradient(1400px 900px at 18% 22%, #ffffff 0%, rgba(255,255,255,0) 60%),
      linear-gradient(150deg, #fdfdfd 0%, #f4f4f6 55%, #ececed 100%);
    position:relative;
  }
  .pad { position:absolute; left:120px; right:120px; }
  .brand { top:104px; display:flex; align-items:center; gap:22px; }
  .brand img { width:64px; height:64px; border-radius:18px; }
  .brand span { font-size:38px; font-weight:500; color:rgba(0,0,0,0.52); letter-spacing:-0.01em; }
  h1 {
    top:430px; font-size:118px; font-weight:700; line-height:1.13;
    letter-spacing:-0.035em; color:#111113; max-width:1750px;
  }
  h1 .rest { color:#b4b4b7; }
  .icons { bottom:112px; display:flex; align-items:center; gap:30px; }
  .icons img {
    width:168px; height:168px; border-radius:37.6px;   /* 22.4% squircle ratio */
    border:1px solid rgba(0,0,0,0.07);
    background:#fff;
    box-shadow:0 14px 34px rgba(0,0,0,0.11), 0 3px 8px rgba(0,0,0,0.06);
  }
  .domain {
    position:absolute; right:120px; bottom:118px;
    display:inline-flex; align-items:center; height:112px; padding:0 54px;
    background:#131315; color:#fff; border-radius:999px;
    font-size:42px; font-weight:700; letter-spacing:-0.015em;
  }
</style></head><body>
  <div class="pad brand"><img src="icon.png"><span>MCP Manager</span></div>
  <h1 class="pad">Every MCP server, every client.<br><span class="rest">One menu bar app.</span></h1>
  <div class="pad icons">
    <img src="claude.png"><img src="cursor.png"><img src="codex.png">
  </div>
  <div class="domain">mcpmanager.space</div>
</body></html>
